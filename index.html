<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>법인카드 예약 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
        .fc { --fc-border-color: #e2e8f0; --fc-today-bg-color: #f1f5f9; }
        .fc .fc-toolbar-title { font-size: 1.25rem !important; font-weight: 600; color: #1e293b; }
        .fc .fc-button-primary { background-color: #1e40af !important; border-color: #1e40af !important; padding: 0.5rem 1rem; font-weight: 500; border-radius: 0.375rem; }
        .fc .fc-button-primary:hover { background-color: #1e3a8a !important; }
        .fc .fc-button-active { background-color: #0f172a !important; border-color: #0f172a !important; }
        .fc-timegrid-slot { height: 3rem !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- [환경 설정 및 구글 시트 주소] ---
        // 구글 Apps Script 웹 앱 URL (여기에 본인의 배포 주소를 꼭 넣어주세요)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAhuFd-dWAUOtckSN2c_kThRSTELSf7K0C_BEtqtcklGnmUDRhZHz98eJkAAScWP4vBg/exec";

        function App() {
            // 상태 관리
            const [user, setUser] = React.useState(null); // 로그인 유저 정보 { name, empNo, isAdmin }
            const [loginInput, setLoginInput] = React.useState({ name: '', empNo: '' });
            const [events, setEvents] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            
            // 캘린더 객체 유지를 위한 Ref 생성 (하얀 화면 버그 방지 핵심 장치)
            const calendarInstanceRef = React.useRef(null);
            
            // 모달(팝업) 제어 상태
            const [showNotice, setShowNotice] = React.useState(false); // 예약 전 안내 팝업
            const [showForm, setShowForm] = React.useState(false); // 입력/상세 폼 모달
            const [selectedEvent, setSelectedEvent] = React.useState(null); // 선택된 예약 정보
            const [selectedSlot, setSelectedSlot] = React.useState(null);

            // 입력 폼 상태
            const [formData, setFormData] = React.useState({
                id: '',
                dept: '간호부',
                name: '',
                empNo: '',
                startTime: '',
                endTime: '',
                budget: '간호부',
                purpose: '',
                details: '',
                contact: ''
            });

            // 오늘 기준 2달 후 한계선 계산
            const todayStr = new Date().toISOString().split('T')[0];
            const maxDate = new Date();
            maxDate.setMonth(maxDate.getMonth() + 2);
            const maxDateStr = maxDate.toISOString().split('T')[0];

            // 구글 시트에서 데이터 가져오기
            const fetchBookings = async () => {
                setLoading(true);
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL);
                    const data = await response.json();
                    
                    const formattedEvents = data.map(b => ({
                        id: b.id,
                        title: `[${b.dept}] ${b.name}`,
                        start: b.startTime,
                        end: b.endTime,
                        extendedProps: { ...b },
                        backgroundColor: b.budget === '간호부' ? '#3b82f6' : b.budget === '총무팀' ? '#10b981' : b.budget === '적정진료관리팀' ? '#f59e0b' : '#64748b',
                        borderColor: 'transparent'
                    }));
                    setEvents(formattedEvents);
                } catch (error) {
                    console.error("데이터 로드 실패:", error);
                } finally {
                    setLoading(false);
                }
            };

            // 1. 로그인 처리 (요청하신 새로운 관리자 조건 반영)
            const handleLogin = (e) => {
                e.preventDefault();
                const trimmedName = loginInput.name.trim();
                const trimmedEmpNo = loginInput.empNo.trim();

                if (!trimmedName || !trimmedEmpNo) {
                    alert("이름과 사번을 정확히 입력해주세요.");
                    return;
                }

                // 조건: 이름에 "DNS" 포함(대소문자 무관) AND 사번이 "1606"
                const isSuperAdmin = trimmedName.toUpperCase().includes("DNS") && trimmedEmpNo === "1606";

                setUser({
                    name: trimmedName,
                    empNo: trimmedEmpNo,
                    isAdmin: isSuperAdmin
                });
            };

            React.useEffect(() => {
                if (user) {
                    fetchBookings();
                }
            }, [user]);

            // 2. 캘린더 생성 기능 최적화 (로그인 직후 딱 1번만 빌드)
            React.useEffect(() => {
                if (!user) return;

                // React가 메인 레이아웃 DOM을 완전히 그린 후 안전하게 실행되도록 지연 적용
                const timer = setTimeout(() => {
                    const calendarEl = document.getElementById('calendar');
                    if (!calendarEl || calendarInstanceRef.current) return;

                    const calendar = new FullCalendar.Calendar(calendarEl, {
                        // 👇 핵심 수정 1: 첫 화면을 월간 달력(구글 캘린더 형식)으로 변경
                        initialView: 'dayGridMonth', 
                        locale: 'ko',
                        headerToolbar: {
                            left: 'prev,next today',
                            center: 'title',
                            right: 'dayGridMonth,timeGridWeek,timeGridDay'
                        },
                        slotMinTime: '07:00:00',
                        slotMaxTime: '22:00:00',
                        allDaySlot: false,
                        validRange: {
                            start: todayStr,
                            end: maxDateStr
                        },
                        selectable: true,
                        select: function(info) {
                            // 👇 핵심 수정 2: 월간 달력에서 날짜 클릭 시 기본 시간(09:00~10:00) 세팅 방어 로직
                            let startT = info.startStr;
                            let endT = info.endStr;
                            
                            // 클릭한 값이 '2024-05-20' 처럼 날짜만 있는 경우 (월간 뷰)
                            if (startT.length === 10) { 
                                startT = `${startT}T09:00`;
                                endT = `${info.startStr}T10:00`; 
                            } else {
                                // 주간/일간 뷰에서 시간까지 드래그한 경우
                                startT = startT.slice(0,16);
                                endT = endT.slice(0,16);
                            }

                            setSelectedSlot({ start: startT, end: endT });
                            setSelectedEvent(null);
                            setShowNotice(true);
                        },
                        eventClick: function(info) {
                            const props = info.event.extendedProps;
                            setSelectedEvent(props);
                            setFormData({
                                id: props.id,
                                dept: props.dept,
                                name: props.name,
                                empNo: props.empNo,
                                startTime: props.startTime,
                                endTime: props.endTime,
                                budget: props.budget,
                                purpose: props.purpose,
                                details: props.details,
                                contact: props.contact
                            });
                            setShowForm(true);
                        }
                    });

                    calendar.render();
                    calendarInstanceRef.current = calendar;
                }, 150);

                return () => {
                    clearTimeout(timer);
                    if (calendarInstanceRef.current) {
                        calendarInstanceRef.current.destroy();
                        calendarInstanceRef.current = null;
                    }
                };
            }, [user]);
                    
            // 3. 구글 시트 데이터가 업데이트되면 데이터만 실시간 반영 (안전한 바인딩)
            React.useEffect(() => {
                if (calendarInstanceRef.current) {
                    calendarInstanceRef.current.removeAllEvents();
                    calendarInstanceRef.current.addEventSource(events);
                }
            }, [events]);

            // 안내 팝업 확인 완료 후 신청 서식 오픈
            const confirmNotice = () => {
                setShowNotice(false);
                setFormData({
                    id: '',
                    dept: '간호부',
                    name: user.name,
                    empNo: user.empNo,
                    startTime: selectedSlot.start,
                    endTime: selectedSlot.end,
                    budget: '간호부',
                    purpose: '',
                    details: '',
                    contact: ''
                });
                setShowForm(true);
            };

            // 예약 등록 및 수정 서버 전송
            const handleSubmit = async (e) => {
                e.preventDefault();
                const phoneRegex = /^010-\d{4}-\d{4}$/;
                if (!phoneRegex.test(formData.contact)) {
                    alert("연락처는 휴대폰 번호 형식(010-0000-0000)으로 정확히 입력해주세요. (내선번호 불가)");
                    return;
                }

                setLoading(true);
                const actionType = formData.id ? "UPDATE" : "CREATE";
                
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: actionType,
                            ...formData
                        })
                    });
                    alert(actionType === "CREATE" ? "예약이 완료되었습니다." : "예약이 수정되었습니다.");
                    setShowForm(false);
                    fetchBookings();
                } catch (error) {
                    alert("서버 통신 중 오류가 발생했습니다.");
                } finally {
                    setLoading(false);
                }
            };

            // 예약 취소(삭제) 처리
            const handleDelete = async () => {
                if (!confirm("정말 이 예약을 취소하시겠습니까?")) return;
                setLoading(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: "DELETE",
                            id: formData.id
                        })
                    });
                    alert("예약이 취소되었습니다.");
                    setShowForm(false);
                    fetchBookings();
                } catch (error) {
                    alert("취소 처리 중 오류가 발생했습니다.");
                } finally {
                    setLoading(false);
                }
            };

            // 권한 체크 (본인 작성 건이거나 최고관리자 권한일 때 허용)
            const hasPermission = selectedEvent ? (user.isAdmin || String(selectedEvent.empNo) === String(user.empNo)) : true;

            // --- 로그인 화면 UI ---
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 px-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
                            <div className="text-center mb-8">
                                <h2 className="text-2xl font-bold text-slate-800 tracking-tight">법인카드 예약 시스템</h2>
                                <p className="text-sm text-slate-400 mt-2">서비스 이용을 위해 이름과 사번을 입력해 주세요.</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">이름</label>
                                    <input type="text" required value={loginInput.name} onChange={e => setLoginInput({...loginInput, name: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 text-sm transition" placeholder="홍길동 (관리자는 DNS 포함)" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">사번</label>
                                    <input type="text" required value={loginInput.empNo} onChange={e => setLoginInput({...loginInput, empNo: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 text-sm transition" placeholder="사번 입력 (관리자는 1606)" />
                                </div>
                                <button type="submit" className="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-3 rounded-xl shadow-lg shadow-blue-700/10 transition text-sm">시스템 접속</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- 메인 달력 화면 UI ---
            return (
                <div className="min-h-screen bg-slate-50 text-slate-800">
                    {/* 상단 웰컴 바 */}
                    <header className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                        <div className="flex items-center space-x-3">
                            <span className="text-lg font-bold text-slate-900 tracking-tight">Corporate Card Booking</span>
                            {user.isAdmin && <span className="bg-red-50 text-red-600 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-red-100">최고관리자</span>}
                        </div>
                        <div className="text-sm text-slate-600 flex items-center space-x-4">
                            <span><strong>{user.name}</strong> 님 반갑습니다.</span>
                            <button onClick={() => { setUser(null); setEvents([]); calendarInstanceRef.current = null; }} className="text-xs text-slate-400 hover:text-red-500 transition">로그아웃</button>
                        </div>
                    </header>

                    {/* 메인 달력 컨테이너 */}
                    <main className="max-w-7xl mx-auto p-4 md:p-8">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 min-h-[600px] relative">
                            {loading && (
                                <div className="absolute top-4 right-6 text-xs font-semibold text-blue-600 animate-pulse bg-blue-50 px-3 py-1.5 rounded-full z-20">
                                    구글 시트 동기화 중...
                                </div>
                            )}
                            <div id="calendar"></div>
                        </div>
                    </main>

                    {/* [팝업 1] 예약 전 유의사항 공지 */}
                    {showNotice && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-md w-full shadow-2xl p-6 border border-slate-100">
                                <h3 className="text-lg font-bold text-slate-900 mb-3">법인카드 대여 사전 유의사항</h3>
                                <div className="bg-slate-50 rounded-xl p-4 text-sm text-slate-600 leading-relaxed mb-6 space-y-2">
                                    <p>• 법인카드는 승인된 목적 외 사용이 엄격히 제한됩니다.</p>
                                    <p>• 사용 후 즉시 반납 및 구글 대장 정리를 완료해 주십시오.</p>
                                    <p className="font-semibold text-blue-600">• (추후 수정될 상세 팝업 문구 안내 영역)</p>
                                </div>
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowNotice(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-3 rounded-xl transition text-sm">취소</button>
                                    <button onClick={confirmNotice} className="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-medium py-3 rounded-xl transition text-sm">유의사항 확인 완료</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* [팝업 2] 예약 작성 / 상세보기 / 수정 폼 모달 */}
                    {showForm && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl p-6 border border-slate-100 my-8">
                                <div className="flex justify-between items-center mb-5">
                                    <h3 className="text-lg font-bold text-slate-900">{formData.id ? "예약 상세 정보" : "신규 카드 예약 신청"}</h3>
                                    <button type="button" onClick={() => setShowForm(false)} className="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
                                </div>
                                
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">대여 부서</label>
                                            <input type="text" disabled={!hasPermission} required value={formData.dept} onChange={e => setFormData({...formData, dept: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm disabled:bg-slate-50" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">사용 예산 구분</label>
                                            <select disabled={!hasPermission} value={formData.budget} onChange={e => setFormData({...formData, budget: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm disabled:bg-slate-50">
                                                <option value="간호부">간호부</option>
                                                <option value="총무팀">총무팀</option>
                                                <option value="적정진료관리팀">적정진료관리팀</option>
                                                <option value="기타">기타</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">대여자 이름</label>
                                            <input type="text" disabled={!hasPermission} required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm disabled:bg-slate-50" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">대여자 사번</label>
                                            <input type="text" disabled={!hasPermission} required value={formData.empNo} onChange={e => setFormData({...formData, empNo: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm disabled:bg-slate-50" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">대여 시작시간</label>
                                            <input type="datetime-local" disabled={!hasPermission} required value={formData.startTime} onChange={e => setFormData({...formData, startTime: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm disabled:bg-slate-50" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">반납 예정시간</label>
                                            <input type="datetime-local" disabled={!hasPermission} required value={formData.endTime} onChange={e => setFormData({...formData, endTime: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm disabled:bg-slate-50" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1">사용 용도 (사업명 또는 사업계획서명)</label>
                                        <input type="text" disabled={!hasPermission} required value={formData.purpose} onChange={e => setFormData({...formData, purpose: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm disabled:bg-slate-50" placeholder="목적을 상세히 기입해주세요." />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1">세부 내용 (선택사항)</label>
                                        <textarea disabled={!hasPermission} value={formData.details} onChange={e => setFormData({...formData, details: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm h-20 disabled:bg-slate-50" placeholder="필요시 기입"></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1">연락처 (휴대폰 번호만 가능)</label>
                                        <input type="text" disabled={!hasPermission} required value={formData.contact} onChange={e => setFormData({...formData, contact: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm disabled:bg-slate-50" placeholder="010-1234-5678" />
                                    </div>

                                    {/* 조작 버튼 영역 */}
                                    <div className="flex space-x-2 pt-4 border-t border-slate-100">
                                        {formData.id && hasPermission && (
                                            <button type="button" onClick={handleDelete} className="bg-red-50 hover:bg-red-100 text-red-600 font-medium px-4 py-2.5 rounded-xl text-sm transition">예약 취소</button>
                                        )}
                                        <div className="flex-1 flex justify-end space-x-2">
                                            <button type="button" onClick={() => setShowForm(false)} className="bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-4 py-2.5 rounded-xl text-sm transition">닫기</button>
                                            {hasPermission && (
                                                <button type="submit" className="bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-md shadow-blue-700/10 transition">
                                                    {formData.id ? "수정 완료" : "예약 확정"}
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                    {!hasPermission && <p className="text-center text-xs text-red-500 mt-2">※ 타인의 예약 내역은 조회만 가능하며, 변경할 수 없습니다.</p>}
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
